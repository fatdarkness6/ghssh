[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghssh"
version = "0.4.0"
description = "Switch named GitHub accounts and commit identities on Linux and Windows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["typer>=0.12,<1", "rich>=13,<15", "pywin32>=306; sys_platform == 'win32'"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/fatdarkness6/ghssh"
Repository = "https://github.com/fatdarkness6/ghssh"
Issues = "https://github.com/fatdarkness6/ghssh/issues"
Changelog = "https://github.com/fatdarkness6/ghssh/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
ghssh = "ghssh.cli:app"

[tool.setuptools.packages.find]
include = ["ghssh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: opt-in isolated real OpenSSH operations (no network)"]

[tool.ruff]
target-version = "py311"
line-length = 100
