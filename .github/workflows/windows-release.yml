name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Install build dependencies
        run: python -m pip install ".[dev]" "pyinstaller>=6.11,<7"
      - run: python -m ruff check .
      - run: python -m pytest -q
      - name: Real local OpenSSH and Git checks
        env:
          GHSSH_RUN_INTEGRATION: '1'
        run: python -m pytest -q -m integration
      - name: Build console executable with bundled Python
        run: python -m PyInstaller --noconfirm --clean --onedir --console --name ghssh --specpath build --hidden-import win32timezone --collect-all typer --collect-all rich packaging/windows/launcher.py
      - name: Test frozen executable
        run: python packaging/windows/smoke_test.py dist/ghssh/ghssh.exe
      - name: Build per-user installer
        shell: pwsh
        env:
          GHSSH_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 is not installed on this runner' }
          & $compiler "/DMyAppVersion=$env:GHSSH_VERSION" packaging/windows/ghssh.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Test installation, PATH, CMD, PowerShell, upgrade, and uninstall
        shell: pwsh
        env:
          GHSSH_VERSION: ${{ steps.version.outputs.value }}
        run: ./packaging/windows/test_installer.ps1 -Version $env:GHSSH_VERSION
      - name: Package portable build and checksums
        shell: pwsh
        env:
          GHSSH_VERSION: ${{ steps.version.outputs.value }}
        run: |
          Copy-Item LICENSE, README.md dist/ghssh/
          Compress-Archive -Path dist/ghssh -DestinationPath "dist/ghssh-${env:GHSSH_VERSION}-windows-x64.zip"
          Get-ChildItem "dist/*-setup.exe", "dist/*-windows-x64.zip" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ghssh-windows-x64
          path: |
            dist/*-setup.exe
            dist/*-windows-x64.zip
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ghssh-windows-x64
          path: release-assets
      - name: Publish tested Windows downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "ghssh $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
